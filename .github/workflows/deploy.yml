name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Web Analytics token (optional)
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_TOKEN }}
        run: |
          if [ -n "$CF_WEB_ANALYTICS_TOKEN" ]; then
            find . -name '*.html' -print0 | xargs -0 sed -i "s/YOUR_BEACON_TOKEN/${CF_WEB_ANALYTICS_TOKEN}/g"
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1059848906e1914e349ac9f704bd60c6
          command: pages deploy . --project-name=numbers-for-agents
