name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Inject Web Analytics token (optional)
        env:
          CF_WEB_ANALYTICS_TOKEN: ${{ secrets.CF_WEB_ANALYTICS_TOKEN }}
        run: |
          if [ -n "$CF_WEB_ANALYTICS_TOKEN" ]; then
            find . -name '*.html' -print0 | xargs -0 sed -i "s/YOUR_BEACON_TOKEN/${CF_WEB_ANALYTICS_TOKEN}/g"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1059848906e1914e349ac9f704bd60c6
        run: npx --yes wrangler@4 pages deploy . --project-name=numbers-for-agents
