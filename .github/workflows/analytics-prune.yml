name: Prune analytics rows

# Deletes analytics rows and visitor-hash salts older than 90 days.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Delete rows older than 90 days
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1059848906e1914e349ac9f704bd60c6
        run: |
          # schema.sql is idempotent. It makes sure the tables exist before DELETE.
          npx --yes wrangler@4 d1 execute waitlist --remote --file=./schema.sql
          npx --yes wrangler@4 d1 execute waitlist --remote --command "
            DELETE FROM analytics_hits WHERE day < date('now', '-90 days');
            DELETE FROM analytics_salts WHERE day < date('now', '-1 day');
          "
